version: 1
baseDigest: 91d2cd3f910c6670924ab694afd812a61c33d3ec88e3b4e28f30d76d2ea62468
capability: authentication
id: sign-in
name: Sign in with locked-account check
nodes:
  - id: submit
    type: event
    label: Member submits credentials
    position: { x: 0, y: 140 }
  - id: valid
    type: decision
    label: Credentials valid?
    position: { x: 220, y: 140 }
    whens:
      check-lock: a member submits valid credentials
      rejected: a member submits invalid credentials
  - id: locked
    type: decision
    label: Account locked?
    position: { x: 460, y: 70 }
    whens:
      active-account: the member's account is not locked
      locked-account: the member's account is locked
  - id: session
    type: outcome
    label: Start session
    position: { x: 720, y: 0 }
    then: the system starts a session
  - id: explain-lock
    type: outcome
    label: Deny access and explain lock
    position: { x: 720, y: 140 }
    then: the system denies access and explains the lock
  - id: denied
    type: outcome
    label: Deny access
    position: { x: 460, y: 260 }
    then: the system denies access
edges:
  - id: submitted
    source: submit
    target: valid
  - id: check-lock
    source: valid
    target: locked
    label: Valid
  - id: rejected
    source: valid
    target: denied
    label: Invalid
  - id: active-account
    source: locked
    target: session
    label: No
  - id: locked-account
    source: locked
    target: explain-lock
    label: Yes
cases:
  - id: valid-credentials
    name: Valid credentials
    edgeIds: [submitted, check-lock, active-account]
    scenario:
      capability: authentication
      requirement: Sign in
      scenario: Valid credentials
      scope: change
      change: adjust-login
      fingerprint: 540bc48559e57fcab92dffa24d0bcb8c6c075a1198601d5922cc5c08744b2944
  - id: invalid-credentials
    name: Invalid credentials
    edgeIds: [submitted, rejected]
    scenario:
      capability: authentication
      requirement: Sign in
      scenario: Invalid credentials
      scope: current
      fingerprint: 44514563fa8a601406995003bc3402181251f320cc524e4072db3e9114d48213
  - id: locked-account
    name: Locked account
    edgeIds: [submitted, check-lock, locked-account]
    scenario:
      capability: authentication
      requirement: Sign in
      scenario: Locked account
      scope: change
      change: adjust-login
      fingerprint: 99828c4da99e3cae666bae3973afd34efd91741936d49effbc7aa9a59b786515
viewport: { x: 20, y: 30, zoom: 0.85 }
