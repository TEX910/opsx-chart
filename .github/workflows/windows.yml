name: Windows OpenSpec CLI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --global @fission-ai/openspec@1.14.0
      - run: openspec --version
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm link
      - run: opsx-chart init --root test/fixtures/project --skills
