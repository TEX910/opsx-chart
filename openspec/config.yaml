schema: spec-driven

context: |
  This repository builds OPSX Chart, an extension suite of skills for OpenSpec.
  Thin workflow wrappers read the installed original OpenSpec skills inline.
  Specifications own behavior. Mermaid views only improve readability of spec
  relationships and WHEN/THEN cases; no graph editor or reverse synchronization exists.
  Runtime helpers use Node.js built-ins and have no npm dependencies or build step.
